name: Publish to ClawHub

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ClawHub CLI
        run: npm i -g clawhub

      - name: Configure auth
        run: |
          mkdir -p ~/.config/clawhub
          cat > ~/.config/clawhub/config.json << 'EOF'
          {
            "registry": "https://clawhub.ai",
            "token": "${{ secrets.CLAWHUB_TOKEN }}"
          }
          EOF

      - name: Publish skill
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          clawhub publish ${{ github.workspace }}/social-coach --slug social-coach --version $VERSION --changelog "publish from ${{ github.sha }}"
