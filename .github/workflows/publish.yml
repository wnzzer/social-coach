name: Publish to ClawHub

on:
  push:
    branches: [main]
  workflow_dispatch:  # 支持手动触发

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ClawHub CLI
        run: npm i -g clawhub

      - name: Configure auth
        run: |
          mkdir -p ~/.config/clawhub
          cat > ~/.config/clawhub/config.json << 'EOF'
          {
            "registry": "https://clawhub.ai",
            "token": "${{ secrets.CLAWHUB_TOKEN }}"
          }
          EOF

      - name: Extract version from SKILL.md
        id: version
        run: |
          VERSION=$(grep 'version:' SKILL.md 2>/dev/null | head -1 | awk '{print $2}' || echo '1.0.0')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        working-directory: social-coach

      - name: Publish skill
        run: clawhub publish ${{ github.workspace }}/social-coach --slug social-coach --version ${{ steps.version.outputs.VERSION }} --changelog "auto publish from ${{ github.sha }}"
